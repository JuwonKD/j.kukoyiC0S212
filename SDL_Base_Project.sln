#include <SDL3/SDL.h> // SDL core:window, renderer, events etc.
#include <SDL3/SDL_main.h>
#include <SDL3_image/SDL_image.h> //SDL image: Loading pages

int main(int argc, char* argv[])
{
    SDL_Init(SDL_INIT_VIDEO);

    SDL_Window* window = SDL_CreateWindow("SDL3 Test", 800, 600, 0);
    SDL_Renderer* renderer = SDL_CreateRenderer(window, nullptr);

    SDL_Surface* surface1 = IMG_Load("C:/Users/HP/Documents/j.kukoyiCSC101/Image 1.png");
    SDL_Texture* texture1 = SDL_CreateTextureFromSurface(renderer, surface1);
    SDL_DestroySurface(surface1);

    SDL_Surface* surface2 = IMG_Load("C:/Users/HP/Documents/j.kukoyiCSC101/Image 1.png");
    SDL_Texture* texture2 = SDL_CreateTextureFromSurface(renderer, surface2);
    SDL_DestroySurface(surface2);

    SDL_Surface* surface3 = IMG_Load("C:/Users/HP/Documents/j.kukoyiCSC101/Image 1.png");
    SDL_Texture* texture3 = SDL_CreateTextureFromSurface(renderer, surface3);
    SDL_DestroySurface(surface3);

    SDL_Surface* surface4 = IMG_Load("C:/Users/HP/Documents/j.kukoyiCSC101/Image 1.png");
    SDL_Texture* texture4 = SDL_CreateTextureFromSurface(renderer, surface4);
    SDL_DestroySurface(surface4);

    SDL_FRect img1 = { 250, 250, 120, 120 };
    SDL_FRect img2 = { 400, 100, 120, 120 };
    SDL_FRect img3 = { 550, 250, 120, 120 };
    SDL_FRect img4 = { 400, 400, 120, 120 };
    SDL_Event event;
    bool running = true;
    while (running) {
        while (SDL_PollEvent(&event)) {
            if (event.type == SDL_EVENT_QUIT) running = false;
            if (event.type == SDL_EVENT_KEY_DOWN)
                if (event.key.key == SDLK_ESCAPE) running = false;
        }
        SDL_RenderClear(renderer);
        SDL_RenderTexture(renderer, texture1, NULL, &img1);
        SDL_RenderTexture(renderer, texture2, NULL, &img2);
        SDL_RenderTexture(renderer, texture3, NULL, &img3);
        SDL_RenderTexture(renderer, texture4, NULL, &img4);
        SDL_RenderPresent(renderer);

    }

    SDL_DestroyRenderer(renderer);
    SDL_DestroyWindow(window);
    SDL_Quit();
    return 0;
}
